name: 项目检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    # 每个 Python 版本各启动一个临时 MySQL；这里不连接本机学习库。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          MYSQL_DATABASE: stock_ci_test
          MYSQL_USER: stock_ci
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: stock_ci
      MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      # 测试夹具要求测试库名称为基础名称加 _test。
      MYSQL_DATABASE: stock_ci
      MYSQL_TEST_DATABASE: stock_ci_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 检查测试库名称
        run: python -c "import os; from app.core.config import get_settings; assert os.environ['MYSQL_TEST_DATABASE'] == get_settings().mysql_database + '_test'"
      - name: 为隔离测试库建表
        env:
          MYSQL_DATABASE: stock_ci_test
        run: python -m alembic upgrade head
      - name: 核对测试库表结构
        env:
          MYSQL_DATABASE: stock_ci_test
        run: python -m alembic check
      - name: 检查代码
        run: python -m ruff check .
      - name: 检查格式
        run: python -m ruff format --check .
      - name: 运行测试
        run: python -m pytest tests -v -rs
